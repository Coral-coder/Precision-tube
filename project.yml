# XcodeGen project. CI (.github/workflows/ios-testflight.yml) generates the .xcodeproj from this.
# The scheme name doubles as the App Store Connect app name.
name: PrecisionTubeCrafts
options:
  bundleIdPrefix: com.coralcoder
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
targets:
  PrecisionTube:
    type: application
    platform: iOS
    sources:
      - PrecisionTube
    settings:
      base:
        PRODUCT_NAME: PrecisionTube
        PRODUCT_BUNDLE_IDENTIFIER: com.coralcoder.precisiontube
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: PrecisionTube/Info.plist
      properties:
        CFBundleDisplayName: PreciseTube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  PrecisionTubeCrafts:
    build:
      targets:
        PrecisionTube: all
    run:
      config: Debug
    archive:
      config: Release
